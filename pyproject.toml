[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "wecom-aibot-python-sdk"
version = "2.0.0"
description = "企业微信智能机器人 Python SDK —— 基于 WebSocket 长连接通道，提供消息收发、流式回复、模板卡片、事件回调、文件下载解密等核心能力。"
readme = "README.md"
license = "MIT"
requires-python = ">=3.15"
authors = [
    {name = "WeCom", email = "wecom@tencent.com"},
]
keywords = ["wecom", "wechat-work", "aibot", "websocket", "sdk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.15",
    "Topic :: Communications :: Chat",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "websockets>=12.0",
    "aiohttp>=3.9",
    "pyee>=11.0",
    "cryptography>=42.0",
    "certifi>=2023.0",
]

[dependency-groups]
dev = [
    "python-dotenv>=1.0",
]

[project.urls]
Homepage = "https://github.com/WecomTeam/wecom-aibot-python-sdk"
Repository = "https://github.com/WecomTeam/wecom-aibot-python-sdk"

[tool.hatch.build.targets.wheel]
packages = ["src/aibot"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/aibot",
    "/tests",
    "/examples",
    "/README.md",
    "/COMPARISON.md",
    "/LICENSE",
    "/.env.example",
    "/.python-version",
    "/pyproject.toml",
    "/uv.lock",
]
